name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # imagem com Android SDK pré-instalado
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PontoAlmocoRHID-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PontoAlmocoRHID.apk
          gh release create "build-${{ github.run_number }}" PontoAlmocoRHID.apk \
            --title "Ponto Almoço RHID (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente." --latest
